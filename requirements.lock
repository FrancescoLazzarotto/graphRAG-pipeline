# Exact versions of the `graphllm` environment, captured 2026-09-08.
#
# `requirements.txt` and `requirements-cpu.txt` carry compatible-range bounds and
# say what the project needs. This file says what it was actually run and
# measured with: every campaign number, every artifact under
# `kg_pipeline/artifacts/` and every figure in the thesis came out of these
# versions. Without it, two installs a month apart are two different systems and
# a result that stops reproducing has no way of being told from a result that
# was wrong.
#
# Python 3.12.13. The project itself is installed editable and is deliberately not
# listed. Transitive dependencies are pinned here too, which is the point: a
# minor release of something nobody names directly is exactly what changes an
# embedding or a tokenizer under a measurement.
#
# Install:      pip install -r requirements.lock
# Regenerate:   conda activate graphllm && pip freeze | grep -v '^-e ' > requirements.lock
#               (then re-add this header)
#
# Regenerate it when a dependency is deliberately upgraded, and say so in the
# commit — never as a side effect of an unrelated change.
