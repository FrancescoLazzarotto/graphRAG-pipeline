name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  # Cheap and fast: proves the floor declared in pyproject (requires-python
  # ">=3.10") still parses. It needs no dependencies, so it reports in seconds
  # even when the test job is still installing torch.
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (declared floor)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Syntax check
        run: python -m compileall -q src scripts kg_pipeline evaluation product

  # The suite exists and passes in ~10 s; until now CI never ran it, so a red
  # test could reach main behind a green check.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # The version the project actually runs on (conda env `graphllm`).
          python-version: "3.12"
          cache: pip

      - name: Install
        # Installs from pyproject alone — no requirements file — so a dependency
        # that is only in requirements.txt shows up here as a failure instead of
        # in a user's clean install.
        run: |
          python -m pip install --upgrade pip
          # CPU-only wheel first. Resolving torch from PyPI on a GitHub runner
          # pulls the whole CUDA stack (~3 GB) that no runner can use; the CPU
          # index is ~200 MB and satisfies the `torch>=2.3,<3.0` requirement, so
          # the editable install below finds it already present.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"

      - name: Version metadata is consistent
        run: |
          python -c "import graphrag, importlib.metadata as m; \
          assert graphrag.__version__ == m.version('graphrag-pipeline'), graphrag.__version__; \
          print('graphrag', graphrag.__version__)"

      - name: Tests
        # Paths come from [tool.pytest.ini_options] testpaths in pyproject.toml.
        run: python -m pytest -q
